<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>יומן משמרות</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1e21">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="משמרות">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --ink:#111827; --muted:#6b7280;
    --border:#e5e7eb; --day-color:#ca8a04; --night-color:#4f46e5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  html, body{
    height:100%; height:100dvh; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Heebo,Arial,sans-serif;
    background:var(--bg); color:var(--ink); direction:rtl;
    user-select:none; -webkit-user-select:none;
  }
  .app-container{
    display:flex; flex-direction:column; height:100%; height:100dvh;
    max-width:480px; margin:0 auto; background:var(--bg);
  }

  /* Compact Header */
  header{
    background:var(--card); padding:8px 12px 6px; border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .top-bar{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
  .top-bar .title{font-size:16px; font-weight:800; white-space:nowrap; display:flex; align-items:center; gap:4px;}
  .top-bar select{
    flex:1; padding:6px 10px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); font-size:13.5px; color:var(--ink); font-family:inherit; font-weight:600;
    min-width:0;
  }
  .top-bar button{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    font-size:15px; width:34px; height:34px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .top-bar button.danger{color:#e0463e;}

  .month-nav{display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .month-nav button{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    font-size:18px; width:36px; height:32px; cursor:pointer; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
  }
  .month-title{font-size:15.5px; font-weight:800; text-align:center;}

  .legend{display:flex; gap:4px; justify-content:center; margin-top:5px; flex-wrap:wrap;}
  .legend .chip{
    display:flex; align-items:center; gap:4px; background:var(--bg); border:1.5px solid transparent;
    border-radius:14px; padding:3px 8px; font-size:11.5px; cursor:pointer; font-weight:600;
  }
  .legend .chip.active{border-color:var(--chip-color, var(--ink)); background:#fff;}
  .legend .chip.dim{opacity:.3;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0;}
  .filter-hint{text-align:center; font-size:11px; color:var(--muted); margin-top:3px;}
  .filter-hint button{
    background:none; border:none; color:var(--ink); text-decoration:underline;
    font-size:11px; cursor:pointer; padding:0; margin-right:4px; font-weight:600;
  }

  /* Main Calendar View - 100% fitted */
  main{
    flex:1; display:flex; flex-direction:column; padding:6px 8px 4px;
    min-height:0; overflow:hidden;
  }
  .weekdays{
    display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
    color:var(--muted); font-size:12px; font-weight:700; padding:2px 0 4px; flex-shrink:0;
  }
  .grid{
    flex:1; display:grid; grid-template-columns:repeat(7,1fr); gap:3px;
    grid-auto-rows:1fr; min-height:0;
  }
  .day{
    background:var(--card); border:1px solid var(--border); border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:2px 1px; cursor:pointer; position:relative; min-height:0; overflow:hidden;
    transition:transform .08s, opacity .15s;
  }
  .day:active{transform:scale(0.95);}
  .day.empty{background:transparent; border:none; cursor:default;}
  .day.today{border:2px solid var(--ink); background:#fafafa;}
  .day.dimmed{opacity:.18;}
  .day .num{font-size:12px; font-weight:800; line-height:1.1; margin-bottom:1px;}
  .day.today .num{color:#2563eb;}

  /* Compact Shift Badges */
  .day .shifts-wrap{width:100%; display:flex; flex-direction:column; gap:1.5px; min-height:0; overflow:hidden;}
  .day .badge{
    font-size:8.5px; line-height:1.15; padding:1px 2px; border-radius:3px;
    display:flex; align-items:center; gap:2px; width:98%; margin:0 auto;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700;
  }
  .day .badge.day-shift{background:rgba(202, 138, 4, 0.15); color:#854d0e;}
  .day .badge.night-shift{background:rgba(79, 70, 229, 0.15); color:#3730a3;}
  .day .badge .mini-dot{width:5px; height:5px; border-radius:50%; flex-shrink:0;}
  .day .badge .badge-icon{font-size:7.5px; flex-shrink:0;}
  .day .note-dot{position:absolute; bottom:1px; left:1px; font-size:7.5px; line-height:1;}

  /* Bottom Actions Bar */
  .bottom-bar{
    display:flex; gap:6px; padding:6px 10px calc(6px + env(safe-area-inset-bottom));
    background:var(--card); border-top:1px solid var(--border); flex-shrink:0;
  }
  .bottom-bar button{
    flex:1; padding:9px 6px; border-radius:10px; border:none; font-size:13px; font-weight:700;
    cursor:pointer; background:var(--bg); border:1px solid var(--border); color:var(--ink);
    display:flex; align-items:center; justify-content:center; gap:4px;
  }
  .bottom-bar button.primary{background:var(--ink); color:#fff;}

  /* Modals / Overlays */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
    align-items:flex-end; justify-content:center; z-index:30;
  }
  .overlay.show{display:flex;}
  .overlay.center{align-items:center; z-index:40;}
  .sheet{
    background:var(--card); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom)); animation:up .18s ease-out;
    max-height:85vh; overflow-y:auto;
  }
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet h2{margin:0 0 10px; font-size:17px; text-align:center; font-weight:800;}
  .sheet .date-subtitle{text-align:center; color:var(--muted); font-size:12.5px; margin:-6px 0 12px; font-weight:600;}

  /* Shift Edit Sections */
  .shift-section{
    background:var(--bg); border-radius:12px; padding:10px; margin-bottom:10px; border:1px solid var(--border);
  }
  .shift-section-header{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-weight:700; font-size:13.5px;
  }
  .shift-options{display:grid; grid-template-columns:repeat(2, 1fr); gap:6px;}
  .sheet button.opt{
    padding:10px 6px; border-radius:9px; border:2px solid var(--border); font-size:13.5px; font-weight:700;
    background:var(--card); cursor:pointer; display:flex; align-items:center; gap:6px; justify-content:center;
    position:relative; transition:all .1s;
  }
  .sheet button.opt.selected{border-color:var(--opt-color, var(--ink)); background:var(--opt-bg, #fff);}
  .sheet button.opt .opt-dot{width:11px; height:11px; border-radius:50%; flex-shrink:0;}
  .sheet button.opt .check{font-size:13px;}

  .note-input{
    width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--border);
    font-size:13.5px; font-family:inherit; margin-top:3px; box-sizing:border-box;
  }

  .sheet .close{
    margin-top:10px; width:100%; padding:12px; border:none; background:var(--ink);
    color:#fff; border-radius:12px; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .sheet .btn-sec{
    margin-top:6px; width:100%; padding:10px; border:1px solid var(--border); background:var(--card);
    border-radius:12px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--muted);
  }

  /* Report Table */
  .report-table{width:100%; border-collapse:collapse; margin-top:6px;}
  .report-table th, .report-table td{padding:8px 5px; border-bottom:1px solid var(--border); font-size:13.5px; text-align:center;}
  .report-table th:first-child, .report-table td:first-child{text-align:right;}
  .report-table th{color:var(--muted); font-size:12px; font-weight:700;}

  /* Guards Manager */
  .guard-row{
    display:flex; gap:8px; align-items:center; margin-bottom:8px; padding:8px 10px;
    border:1px solid var(--border); border-radius:12px; background:var(--bg);
  }
  .guard-row input{
    flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
    font-size:14px; font-weight:600; font-family:inherit; background:#fff; min-width:0;
  }
  .guard-color-btn{
    width:34px; height:34px; border-radius:50%; border:3px solid #fff;
    box-shadow:0 2px 5px rgba(0,0,0,0.18), inset 0 0 0 1px rgba(0,0,0,0.1);
    cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    transition:transform .12s;
  }
  .guard-color-btn:active{transform:scale(0.9);}
  .guard-row .del{
    background:none; border:none; font-size:18px; cursor:pointer; padding:4px;
    color:#9ca3af; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .guard-row .del:active{color:#e0463e;}
  .add-guard-btn{width:100%; padding:11px; border:2px dashed var(--border); border-radius:12px; background:none; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer;}

  /* Color Picker Popup Sheet */
  .color-picker-card{
    background:var(--card); width:88%; max-width:320px; border-radius:18px;
    padding:16px; text-align:center; animation:popIn .18s ease-out; box-shadow:0 12px 30px rgba(0,0,0,0.3);
  }
  @keyframes popIn{from{transform:scale(0.85); opacity:0;} to{transform:scale(1); opacity:1;}}
  .color-picker-card h3{margin:0 0 10px; font-size:15.5px; font-weight:800;}
  .color-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin:12px 0; justify-items:center;
  }
  .color-swatch-circle{
    width:44px; height:44px; border-radius:50%; cursor:pointer; display:flex;
    align-items:center; justify-content:center; color:#fff; font-size:17px; font-weight:bold;
    box-shadow:0 2px 5px rgba(0,0,0,0.15); transition:transform .12s; border:3px solid transparent;
  }
  .color-swatch-circle:active{transform:scale(0.9);}
  .color-swatch-circle.selected{border-color:var(--ink); transform:scale(1.06);}

  input[type=file]{display:none;}
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="top-bar">
      <div class="title">🗓️ יומן:</div>
      <select id="calendarSelect"></select>
      <button id="addCalendarBtn" title="יומן חדש">➕</button>
      <button id="delCalendarBtn" class="danger" title="מחק יומן">🗑️</button>
    </div>
    <div class="month-nav">
      <button id="prevBtn">‹</button>
      <div class="month-title" id="monthTitle">—</div>
      <button id="nextBtn">›</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="filter-hint" id="filterHint" style="display:none;">
      מציג רק נבחרים <button id="clearFilterBtn">נקה סינון</button>
    </div>
  </header>

  <main>
    <div class="weekdays">
      <div>א׳</div><div>ב׳</div><div>ג׳</div><div>ד׳</div><div>ה׳</div><div>ו׳</div><div>ש׳</div>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <div class="bottom-bar">
    <button class="primary" id="reportBtn">📊 דוח וסיכום</button>
    <button id="guardsBtn">👥 שומרים</button>
    <button id="backupBtn">💾 גיבוי</button>
  </div>
</div>

<!-- Day Edit Overlay -->
<div class="overlay" id="dayOverlay">
  <div class="sheet">
    <h2 id="dayTitle">עריכת יום</h2>
    <div class="date-subtitle" id="daySubtitle"></div>

    <!-- Day Shift Section -->
    <div class="shift-section">
      <div class="shift-section-header">
        <span>☀️ משמרת יום (בוקר)</span>
        <span style="font-size:11.5px; color:var(--muted);">בחר שומר</span>
      </div>
      <div class="shift-options" id="dayShiftList"></div>
    </div>

    <!-- Night Shift Section -->
    <div class="shift-section">
      <div class="shift-section-header">
        <span>🌙 משמרת לילה</span>
        <span style="font-size:11.5px; color:var(--muted);">בחר שומר</span>
      </div>
      <div class="shift-options" id="nightShiftList"></div>
    </div>

    <!-- Note Section -->
    <div style="margin-bottom:10px;">
      <label style="font-size:12.5px; font-weight:700; color:var(--muted); display:block; margin-bottom:3px;">📝 הערה ליום זה (אופציונלי):</label>
      <input type="text" id="dayNoteInput" class="note-input" placeholder="למשל: תגבור, חג, החלפה..." maxlength="40">
    </div>

    <button class="close" id="daySave">שמור וסגור</button>
    <button class="btn-sec" id="dayClear" style="color:#e0463e;">🗑️ נקה את כל היום</button>
  </div>
</div>

<!-- Report Overlay -->
<div class="overlay" id="reportOverlay">
  <div class="sheet">
    <h2>📊 דוח וסיכום משמרות</h2>
    <div id="reportBody"></div>
    <button class="close" id="shareWhatsAppBtn" style="background:#25D366; margin-top:12px;">📲 שתף סיכום ל-WhatsApp</button>
    <button class="btn-sec" id="exportCsvBtn" style="margin-top:6px;">⬇️ הורד קובץ דוח (CSV)</button>
    <button class="close" id="reportClose" style="margin-top:8px;">סגור</button>
  </div>
</div>

<!-- Guards Overlay -->
<div class="overlay" id="guardsOverlay">
  <div class="sheet">
    <h2>👥 ניהול שומרים</h2>
    <div id="guardsList"></div>
    <button class="add-guard-btn" id="addGuardBtn">➕ הוסף שומר חדש</button>
    <button class="close" id="guardsSave" style="margin-top:12px;">שמור</button>
  </div>
</div>

<!-- Color Picker Overlay -->
<div class="overlay center" id="colorPickerOverlay">
  <div class="color-picker-card">
    <h3 id="colorPickerTitle">בחר צבע לשומר</h3>
    <div class="color-grid" id="colorPickerGrid"></div>
    <button class="btn-sec" id="colorPickerCancel" style="margin-top:6px;">ביטול</button>
  </div>
</div>

<!-- Backup Overlay -->
<div class="overlay" id="backupOverlay">
  <div class="sheet">
    <h2>💾 גיבוי ושחזור נתונים</h2>
    <p style="font-size:13px; color:var(--muted); line-height:1.4; text-align:center; margin-bottom:12px;">
      כל הנתונים נשמרים במכשיר. אפשר להוריד קובץ גיבוי או לשחזר בכל עת.
    </p>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <button class="btn-sec" id="downloadBackupBtn" style="color:var(--ink); font-weight:700;">⬇️ הורד קובץ גיבוי מלא (JSON)</button>
      <button class="btn-sec" id="restoreBackupBtn" style="color:var(--ink); font-weight:700;">⬆️ שחזר נתונים מקובץ גיבוי</button>
      <input type="file" id="backupFileInput" accept=".json,application/json">
    </div>
    <button class="close" id="backupClose" style="margin-top:12px;">סגור</button>
  </div>
</div>

<input type="file" id="importCsvFile" accept=".csv,text/csv">

<script>
(function(){
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }

  var STORAGE_KEY_V2 = 'uzi_shift_tracker_v2';

  var PALETTE = [
    {name:'אדום', color:'#e0463e'},
    {name:'כחול', color:'#2563eb'},
    {name:'ירוק', color:'#16a34a'},
    {name:'סגול', color:'#7c3aed'},
    {name:'כתום', color:'#ea580c'},
    {name:'טורקיז', color:'#0d9488'},
    {name:'ורוד', color:'#db2777'},
    {name:'חרדל', color:'#ca8a04'},
    {name:'אינדיגו', color:'#4f46e5'},
    {name:'תכלת', color:'#0284c7'},
    {name:'אזמרגד', color:'#059669'},
    {name:'סגול כהה', color:'#9333ea'},
    {name:'חום', color:'#854d0e'},
    {name:'פוקסיה', color:'#c026d3'},
    {name:'אפור כהה', color:'#475569'},
    {name:'שחור', color:'#1e293b'}
  ];

  var DAY_NAMES_HE = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
  var MONTH_NAMES_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

  function uid(prefix){
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function nextColor(usedColors){
    for(var i=0;i<PALETTE.length;i++){
      if(usedColors.indexOf(PALETTE[i].color) === -1) return PALETTE[i].color;
    }
    return 'hsl(' + Math.floor(Math.random()*360) + ',65%,45%)';
  }

  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2]; }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function colorToRgba(color, alpha){
    if(color.charAt(0) !== '#') return color;
    var rgb = hexToRgb(color);
    return 'rgba('+rgb.r+','+rgb.b+','+rgb.b+','+alpha+')';
  }

  function defaultCalendars(){
    return {
      main: {
        name: 'יומן ראשי',
        guards: [
          { id:'red', name:'אדום', color:'#e0463e' },
          { id:'blue', name:'כחול', color:'#2563eb' },
          { id:uid('g'), name:'משה', color:'#16a34a' }
        ],
        shifts: {}
      }
    };
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY_V2);
      if(raw){
        var s = JSON.parse(raw);
        if(s && s.calendars && s.order && s.order.length) return s;
      }
    }catch(e){}

    var state = { activeCalendarId:'main', order:['main'], calendars:defaultCalendars() };
    persist(state);
    return state;
  }

  function persist(s){ localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(s)); }

  var state = load();
  function save(){ persist(state); }
  function cal(){ return state.calendars[state.activeCalendarId]; }
  function findGuard(id){
    if(!cal() || !cal().guards) return null;
    var gs = cal().guards;
    for(var i=0;i<gs.length;i++){ if(gs[i].id===id) return gs[i]; }
    return null;
  }

  function getDayEntry(dateKey){
    var c = cal();
    var val = c.shifts[dateKey];
    if(!val) return { day: [], night: [], note: '' };
    if(Array.isArray(val)) return { day: val.slice(), night: [], note: '' };
    return {
      day: Array.isArray(val.day) ? val.day.slice() : [],
      night: Array.isArray(val.night) ? val.night.slice() : [],
      note: val.note || ''
    };
  }

  function setDayEntry(dateKey, entry){
    var c = cal();
    if(!entry || (!entry.day.length && !entry.night.length && !entry.note)){
      delete c.shifts[dateKey];
    } else {
      c.shifts[dateKey] = {
        day: entry.day || [],
        night: entry.night || [],
        note: (entry.note || '').trim()
      };
    }
  }

  var today = new Date();
  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth();
  var selectedKey = null;
  var tempDayEntry = { day:[], night:[], note:'' };
  var activeFilters = {};
  var currentEditingGuard = null;

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function keyFor(y,m,d){ return y+'-'+pad(m+1)+'-'+pad(d); }

  function renderCalendarSelect(){
    var sel = document.getElementById('calendarSelect');
    sel.innerHTML = '';
    for(var i=0;i<state.order.length;i++){
      var id = state.order[i];
      var c = state.calendars[id];
      if(!c) continue;
      var opt = document.createElement('option');
      opt.value = id;
      opt.textContent = c.name;
      if(id === state.activeCalendarId) opt.selected = true;
      sel.appendChild(opt);
    }
  }
  document.getElementById('calendarSelect').addEventListener('change', function(e){
    state.activeCalendarId = e.target.value;
    activeFilters = {};
    save();
    renderAll();
  });
  document.getElementById('addCalendarBtn').addEventListener('click', function(){
    var name = window.prompt('שם היומן החדש:');
    if(!name || !name.trim()) return;
    var id = uid('c');
    state.calendars[id] = {
      name: name.trim(),
      guards: [
        { id:uid('g'), name:'אדום', color:'#e0463e' },
        { id:uid('g'), name:'כחול', color:'#2563eb' }
      ],
      shifts: {}
    };
    state.order.push(id);
    state.activeCalendarId = id;
    activeFilters = {};
    save();
    renderAll();
  });
  document.getElementById('delCalendarBtn').addEventListener('click', function(){
    if(state.order.length <= 1){
      alert('חייב להישאר לפחות יומן אחד.');
      return;
    }
    var c = cal();
    if(!window.confirm('למחוק את היומן "' + c.name + '" וכל הנתונים שלו? אי אפשר לבטל.')) return;
    delete state.calendars[state.activeCalendarId];
    state.order = state.order.filter(function(id){ return id !== undefined && state.calendars[id]; });
    state.activeCalendarId = state.order[0];
    activeFilters = {};
    save();
    renderAll();
  });

  function renderLegend(){
    var legend = document.getElementById('legend');
    legend.innerHTML = '';
    var guards = cal().guards;
    for(var i=0;i<guards.length;i++){
      (function(g){
        var chip = document.createElement('div');
        chip.className = 'chip';
        chip.style.setProperty('--chip-color', g.color);
        if(activeFilters[g.id]) chip.classList.add('active');
        else if(Object.keys(activeFilters).length) chip.classList.add('dim');
        var dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = g.color;
        chip.appendChild(dot);
        var label = document.createElement('span');
        label.textContent = g.name;
        chip.appendChild(label);
        chip.addEventListener('click', function(){
          if(activeFilters[g.id]) delete activeFilters[g.id];
          else activeFilters[g.id] = true;
          renderLegend();
          renderCalendar();
        });
        legend.appendChild(chip);
      })(guards[i]);
    }
    var hint = document.getElementById('filterHint');
    hint.style.display = Object.keys(activeFilters).length ? 'block' : 'none';
  }
  document.getElementById('clearFilterBtn').addEventListener('click', function(){
    activeFilters = {};
    renderLegend();
    renderCalendar();
  });

  function renderCalendar(){
    document.getElementById('monthTitle').textContent = MONTH_NAMES_HE[viewMonth] + ' ' + viewYear;
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var hasFilter = Object.keys(activeFilters).length > 0;

    var firstDay = new Date(viewYear, viewMonth, 1).getDay();
    var daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

    for(var i=0;i<firstDay;i++){
      var empty = document.createElement('div');
      empty.className = 'day empty';
      grid.appendChild(empty);
    }

    for(var d=1; d<=daysInMonth; d++){
      var key = keyFor(viewYear, viewMonth, d);
      var cell = document.createElement('div');
      cell.className = 'day';

      var entry = getDayEntry(key);
      var dayGuards = entry.day.map(findGuard).filter(Boolean);
      var nightGuards = entry.night.map(findGuard).filter(Boolean);
      var allAssigned = dayGuards.concat(nightGuards);

      if(hasFilter){
        var matches = allAssigned.some(function(g){ return activeFilters[g.id]; });
        if(!matches) cell.classList.add('dimmed');
      }

      if(viewYear===today.getFullYear() && viewMonth===today.getMonth() && d===today.getDate()){
        cell.classList.add('today');
      }

      var num = document.createElement('div');
      num.className = 'num';
      num.textContent = d;
      cell.appendChild(num);

      var shiftsWrap = document.createElement('div');
      shiftsWrap.className = 'shifts-wrap';

      // Day Badges
      for(var dg=0; dg<dayGuards.length; dg++){
        var b = document.createElement('div');
        b.className = 'badge day-shift';
        var icon = document.createElement('span');
        icon.className = 'badge-icon';
        icon.textContent = '☀️';
        b.appendChild(icon);
        var dot = document.createElement('span');
        dot.className = 'mini-dot';
        dot.style.background = dayGuards[dg].color;
        b.appendChild(dot);
        var span = document.createElement('span');
        span.textContent = dayGuards[dg].name;
        b.appendChild(span);
        shiftsWrap.appendChild(b);
      }

      // Night Badges
      for(var ng=0; ng<nightGuards.length; ng++){
        var b2 = document.createElement('div');
        b2.className = 'badge night-shift';
        var icon2 = document.createElement('span');
        icon2.className = 'badge-icon';
        icon2.textContent = '🌙';
        b2.appendChild(icon2);
        var dot2 = document.createElement('span');
        dot2.className = 'mini-dot';
        dot2.style.background = nightGuards[ng].color;
        b2.appendChild(dot2);
        var span2 = document.createElement('span');
        span2.textContent = nightGuards[ng].name;
        b2.appendChild(span2);
        shiftsWrap.appendChild(b2);
      }

      cell.appendChild(shiftsWrap);

      if(entry.note){
        var noteDot = document.createElement('div');
        noteDot.className = 'note-dot';
        noteDot.textContent = '📝';
        noteDot.title = entry.note;
        cell.appendChild(noteDot);
      }

      bindDayEvents(cell, key);
      grid.appendChild(cell);
    }
  }

  function bindDayEvents(cell, key){
    var pressTimer = null;
    var moved = false;

    function startPress(){
      moved = false;
      pressTimer = setTimeout(function(){
        if(navigator.vibrate) try{ navigator.vibrate(40); }catch(e){}
        openDaySheet(key);
      }, 350);
    }
    function cancelPress(){
      if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
    }

    cell.addEventListener('touchstart', function(e){
      startPress();
    }, {passive:true});

    cell.addEventListener('touchmove', function(){
      moved = true;
      cancelPress();
    }, {passive:true});

    cell.addEventListener('touchend', function(){
      cancelPress();
    });

    cell.addEventListener('click', function(){
      if(!moved){
        openDaySheet(key);
      }
    });
  }

  function openDaySheet(key){
    selectedKey = key;
    tempDayEntry = getDayEntry(key);
    var parts = key.split('-');
    var dObj = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
    var dayOfWeek = DAY_NAMES_HE[dObj.getDay()];

    document.getElementById('dayTitle').textContent = 'עריכת יום ' + dayOfWeek;
    document.getElementById('daySubtitle').textContent = parts[2] + '/' + parts[1] + '/' + parts[0];
    document.getElementById('dayNoteInput').value = tempDayEntry.note || '';

    renderSlotGuards('dayShiftList', 'day');
    renderSlotGuards('nightShiftList', 'night');

    document.getElementById('dayOverlay').classList.add('show');
  }

  function renderSlotGuards(containerId, slot){
    var list = document.getElementById(containerId);
    list.innerHTML = '';
    var c = cal();
    var current = tempDayEntry[slot] || [];

    for(var i=0;i<c.guards.length;i++){
      (function(g){
        var btn = document.createElement('button');
        btn.className = 'opt';
        var selected = current.indexOf(g.id) !== -1;
        if(selected){
          btn.classList.add('selected');
          btn.style.setProperty('--opt-color', g.color);
          btn.style.setProperty('--opt-bg', colorToRgba(g.color,.15));
        }
        var dot = document.createElement('span');
        dot.className = 'opt-dot';
        dot.style.background = g.color;
        btn.appendChild(dot);

        var label = document.createElement('span');
        label.textContent = g.name;
        btn.appendChild(label);

        if(selected){
          var check = document.createElement('span');
          check.className = 'check';
          check.textContent = '✓';
          btn.appendChild(check);
        }

        btn.addEventListener('click', function(){
          var idx = tempDayEntry[slot].indexOf(g.id);
          if(idx !== -1){
            tempDayEntry[slot].splice(idx, 1);
          } else {
            tempDayEntry[slot].push(g.id);
          }
          renderSlotGuards(containerId, slot);
        });

        list.appendChild(btn);
      })(c.guards[i]);
    }
  }

  document.getElementById('daySave').addEventListener('click', function(){
    if(selectedKey){
      tempDayEntry.note = document.getElementById('dayNoteInput').value;
      setDayEntry(selectedKey, tempDayEntry);
      save();
      renderCalendar();
    }
    closeDaySheet();
  });

  document.getElementById('dayClear').addEventListener('click', function(){
    if(selectedKey){
      setDayEntry(selectedKey, null);
      save();
      renderCalendar();
    }
    closeDaySheet();
  });

  function closeDaySheet(){
    document.getElementById('dayOverlay').classList.remove('show');
    selectedKey = null;
  }
  document.getElementById('dayOverlay').addEventListener('click', function(e){
    if(e.target === this) closeDaySheet();
  });

  document.getElementById('prevBtn').addEventListener('click', function(){
    viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;}
    renderCalendar();
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;}
    renderCalendar();
  });

  // Report & WhatsApp Share
  var currentMonthReportText = '';

  function openReport(){
    var c = cal();
    var monthPrefix = viewYear + '-' + pad(viewMonth+1);
    var guards = c.guards;

    var dayCounts = {}, nightCounts = {}, totalCounts = {};
    var mDayCounts = {}, mNightCounts = {}, mTotalCounts = {};

    for(var i=0;i<guards.length;i++){
      var gid = guards[i].id;
      dayCounts[gid] = 0; nightCounts[gid] = 0; totalCounts[gid] = 0;
      mDayCounts[gid] = 0; mNightCounts[gid] = 0; mTotalCounts[gid] = 0;
    }

    var monthActiveDays = 0;

    for(var k in c.shifts){
      var entry = getDayEntry(k);
      var inMonth = k.indexOf(monthPrefix) === 0;
      if(inMonth && (entry.day.length || entry.night.length)) monthActiveDays++;

      for(var d=0; d<entry.day.length; d++){
        var id = entry.day[d];
        if(dayCounts[id] !== undefined){ dayCounts[id]++; totalCounts[id]++; }
        if(inMonth && mDayCounts[id] !== undefined){ mDayCounts[id]++; mTotalCounts[id]++; }
      }
      for(var n=0; n<entry.night.length; n++){
        var id2 = entry.night[n];
        if(nightCounts[id2] !== undefined){ nightCounts[id2]++; totalCounts[id2]++; }
        if(inMonth && mNightCounts[id2] !== undefined){ mNightCounts[id2]++; mTotalCounts[id2]++; }
      }
    }

    var html = '<div style="font-size:14px;font-weight:800;margin-bottom:6px;">'
      + c.name + ' — ' + MONTH_NAMES_HE[viewMonth] + ' ' + viewYear + '</div>';

    html += '<table class="report-table"><thead><tr><th>שומר</th><th>☀️ יום</th><th>🌙 לילה</th><th>סה״כ</th></tr></thead><tbody>';
    for(var i=0;i<guards.length;i++){
      var g = guards[i];
      html += '<tr><td><span class="dot" style="background:'+g.color+'; margin-left:4px;"></span>'+g.name+'</td>'
        + '<td>'+mDayCounts[g.id]+'</td><td>'+mNightCounts[g.id]+'</td><td><b>'+mTotalCounts[g.id]+'</b></td></tr>';
    }
    html += '</tbody></table>';
    html += '<div style="font-size:12px; color:var(--muted); margin-top:6px;">סה״כ ימים פעילים החודש: <b>' + monthActiveDays + '</b></div>';

    var lines = [];
    lines.push('🗓️ *דוח משמרות — ' + c.name + '*');
    lines.push('📅 *חודש:* ' + MONTH_NAMES_HE[viewMonth] + ' ' + viewYear);
    lines.push('');
    lines.push('☀️ *משמרות יום:*');
    for(var i=0;i<guards.length;i++){
      if(mDayCounts[guards[i].id] > 0){
        lines.push('• ' + guards[i].name + ': ' + mDayCounts[guards[i].id]);
      }
    }
    lines.push('');
    lines.push('🌙 *משמרות לילה:*');
    for(var i=0;i<guards.length;i++){
      if(mNightCounts[guards[i].id] > 0){
        lines.push('• ' + guards[i].name + ': ' + mNightCounts[guards[i].id]);
      }
    }
    lines.push('');
    lines.push('📊 *סה״כ משמרות:*');
    for(var i=0;i<guards.length;i++){
      lines.push('• ' + guards[i].name + ': ' + mTotalCounts[guards[i].id]);
    }
    lines.push('');
    lines.push('ימים פעילים: ' + monthActiveDays);

    currentMonthReportText = lines.join('\n');

    document.getElementById('reportBody').innerHTML = html;
    document.getElementById('reportOverlay').classList.add('show');
  }

  document.getElementById('reportBtn').addEventListener('click', openReport);
  document.getElementById('reportClose').addEventListener('click', function(){
    document.getElementById('reportOverlay').classList.remove('show');
  });
  document.getElementById('reportOverlay').addEventListener('click', function(e){
    if(e.target === this) this.classList.remove('show');
  });

  document.getElementById('shareWhatsAppBtn').addEventListener('click', function(){
    if(!currentMonthReportText) return;
    var waUrl = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(currentMonthReportText);
    window.open(waUrl, '_blank');
  });

  // Guards Management
  function openGuards(){
    renderGuardsList();
    document.getElementById('guardsOverlay').classList.add('show');
  }
  function renderGuardsList(){
    var wrap = document.getElementById('guardsList');
    wrap.innerHTML = '';
    var c = cal();
    for(var i=0;i<c.guards.length;i++){
      (function(g, idx){
        var row = document.createElement('div');
        row.className = 'guard-row';

        var del = document.createElement('button');
        del.className = 'del';
        del.textContent = '🗑️';
        del.title = 'מחק שומר';
        del.addEventListener('click', function(){
          if(c.guards.length <= 1){
            alert('חייב להישאר לפחות שומר אחד ביומן.');
            return;
          }
          c.guards.splice(idx,1);
          renderGuardsList();
        });
        row.appendChild(del);

        var colorBtn = document.createElement('button');
        colorBtn.className = 'guard-color-btn';
        colorBtn.style.background = g.color;
        colorBtn.title = 'לחץ לבחירת צבע';
        colorBtn.addEventListener('click', function(){
          openColorPicker(g);
        });
        row.appendChild(colorBtn);

        var input = document.createElement('input');
        input.value = g.name;
        input.maxLength = 20;
        input.placeholder = 'שם השומר...';
        input.addEventListener('input', function(){ g.name = input.value; });
        row.appendChild(input);

        wrap.appendChild(row);
      })(c.guards[i], i);
    }
  }

  // Color Picker Dialog
  function openColorPicker(guard){
    currentEditingGuard = guard;
    document.getElementById('colorPickerTitle').textContent = 'בחר צבע עבור ' + (guard.name || 'שומר');
    var grid = document.getElementById('colorPickerGrid');
    grid.innerHTML = '';

    for(var s=0; s<PALETTE.length; s++){
      (function(opt){
        var circle = document.createElement('div');
        circle.className = 'color-swatch-circle';
        circle.style.background = opt.color;
        if(guard.color === opt.color){
          circle.classList.add('selected');
          circle.textContent = '✓';
        }
        circle.addEventListener('click', function(){
          guard.color = opt.color;
          closeColorPicker();
          renderGuardsList();
        });
        grid.appendChild(circle);
      })(PALETTE[s]);
    }

    document.getElementById('colorPickerOverlay').classList.add('show');
  }

  function closeColorPicker(){
    document.getElementById('colorPickerOverlay').classList.remove('show');
    currentEditingGuard = null;
  }
  document.getElementById('colorPickerCancel').addEventListener('click', closeColorPicker);
  document.getElementById('colorPickerOverlay').addEventListener('click', function(e){
    if(e.target === this) closeColorPicker();
  });

  document.getElementById('guardsBtn').addEventListener('click', openGuards);
  document.getElementById('addGuardBtn').addEventListener('click', function(){
    var c = cal();
    var used = c.guards.map(function(g){ return g.color; });
    c.guards.push({ id:uid('g'), name:'שומר ' + (c.guards.length+1), color: nextColor(used) });
    renderGuardsList();
  });
  document.getElementById('guardsSave').addEventListener('click', function(){
    save();
    renderCalendarSelect();
    renderLegend();
    renderCalendar();
    document.getElementById('guardsOverlay').classList.remove('show');
  });
  document.getElementById('guardsOverlay').addEventListener('click', function(e){
    if(e.target === this) this.classList.remove('show');
  });

  // Backup & Restore
  document.getElementById('backupBtn').addEventListener('click', function(){
    document.getElementById('backupOverlay').classList.add('show');
  });
  document.getElementById('backupClose').addEventListener('click', function(){
    document.getElementById('backupOverlay').classList.remove('show');
  });
  document.getElementById('backupOverlay').addEventListener('click', function(e){
    if(e.target === this) this.classList.remove('show');
  });

  document.getElementById('downloadBackupBtn').addEventListener('click', function(){
    var dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(state, null, 2));
    var a = document.createElement('a');
    a.href = dataStr;
    a.download = 'גיבוי_משמרות_' + keyFor(viewYear, viewMonth, today.getDate()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  document.getElementById('restoreBackupBtn').addEventListener('click', function(){
    document.getElementById('backupFileInput').click();
  });

  document.getElementById('backupFileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var restored = JSON.parse(reader.result);
        if(restored && restored.calendars && restored.order){
          state = restored;
          save();
          renderAll();
          alert('הנתונים שוחזרו בהצלחה!');
          document.getElementById('backupOverlay').classList.remove('show');
        } else {
          alert('קובץ הגיבוי אינו תקין.');
        }
      }catch(err){
        alert('שגיאה בקריאת הקובץ.');
      }
    };
    reader.readAsText(file);
  });

  // Export CSV
  function csvEscape(v){
    return '"' + String(v||'').replace(/"/g,'""') + '"';
  }
  document.getElementById('exportCsvBtn').addEventListener('click', function(){
    var c = cal();
    var lines = [csvEscape('תאריך') + ',' + csvEscape('משמרת יום') + ',' + csvEscape('משמרת לילה') + ',' + csvEscape('הערה')];
    var keys = Object.keys(c.shifts).sort();
    for(var i=0;i<keys.length;i++){
      var entry = getDayEntry(keys[i]);
      var dayNames = entry.day.map(findGuard).filter(Boolean).map(function(g){ return g.name; }).join('; ');
      var nightNames = entry.night.map(findGuard).filter(Boolean).map(function(g){ return g.name; }).join('; ');
      lines.push(csvEscape(keys[i]) + ',' + csvEscape(dayNames) + ',' + csvEscape(nightNames) + ',' + csvEscape(entry.note));
    }
    var csv = '﻿' + lines.join('\r\n');
    var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = c.name.replace(/[\\/:*?"<>|]/g,'_') + '_משמרות.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  function renderAll(){
    renderCalendarSelect();
    renderLegend();
    renderCalendar();
  }
  renderAll();
})();
</script>
</body>
</html>
